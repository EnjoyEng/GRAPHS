<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>👉🎁 Prizes Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #fcfcfc;
    }

    /* במחשב - הכל נשאר כפי שאהבת */
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; 
    }

    iframe {
      width: 180%; 
      height: 150%; 
      border: none;
      transform: scale(0.55); 
      transform-origin: center center;
      margin-right: -10%; 
    }

    /* התיקון החדש לטלפון - שיטת הגלילה */
    @media only screen and (max-width: 600px) {
      .container {
        display: block;
        overflow-x: auto; /* מאפשר גלילה הצידה */
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch; /* גלילה חלקה באייפון */
      }
      
      iframe {
        /* כאן אנחנו נותנים לגרף רוחב קבוע וגדול מספיק לכל העמודות */
        width: 1000px; 
        height: 100vh;
        transform: scale(0.8); /* זום הרבה יותר נעים לעין */
        transform-origin: top right;
        margin-right: 0;
        position: relative;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <iframe scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT19kOZGAJsKVeMmF1oIn5sjRm18MnOKs6Ucm1N-8QYGWJ85eLTktyXTS2UiS0u_3LreAsUprDGBFr1/pubchart?oid=2083135260&format=interactive"></iframe>
  </div>
</body>
</html>
