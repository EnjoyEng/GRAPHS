<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>👉🎁 Prizes Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfcfc;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      /* הפעם נצמיד לימין כדי שההתחלה בעברית תהיה יציבה */
      justify-content: flex-start; 
      align-items: center;
      overflow: hidden;
    }

    iframe {
      /* הגדלנו ל-250% כדי לתת לכל העמודות האדומות מקום לפרוס כנפיים */
      width: 250%; 
      height: 100%; 
      border: none;
      
      /* כיווץ חזק יותר (0.4) כדי להכניס את ה-250% לתוך המסך */
      transform: scale(0.4); 
      /* קריטי: הכיווץ קורה מנקודת המבט הימנית-עליונה */
      transform-origin: top right; 
    }

    /* התאמה מיוחדת לטלפון שבה הכל בדרך כלל נחתך */
    @media (max-width: 768px) {
      iframe {
        width: 350%; /* שטח עבודה ענק למובייל */
        transform: scale(0.28); /* כיווץ משמעותי */
        transform-origin: top right;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <iframe scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT19kOZGAJsKVeMmF1oIn5sjRm18MnOKs6Ucm1N-8QYGWJ85eLTktyXTS2UiS0u_3LreAsUprDGBFr1/pubchart?oid=2083135260&format=interactive"></iframe>
  </div>
</body>
</html>
