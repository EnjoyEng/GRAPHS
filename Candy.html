<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #fcfcfc;
  }

  .container {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  iframe {
    /* במקום 200%, נשתמש ברוחב שיאלץ את גוגל להצטמצם */
    width: 100vw; 
    height: 100vh;
    border: none;
    
    /* כיווץ של 0.8 יכניס את השוליים פנימה */
    transform: scale(0.9); 
    transform-origin: center center;
  }

  /* תיקון ספציפי למובייל - כאן הקסם */
  @media (max-width: 600px) {
    iframe {
      width: 160vw; /* נותן לגרף מרחב נשימה לרוחב */
      height: 100vh;
      transform: scale(0.6); /* ומכווץ אותו חזק כדי שכל העמודות יכנסו */
    }
  }
</style>

<body>
  <div class="container">
    <iframe scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT19kOZGAJsKVeMmF1oIn5sjRm18MnOKs6Ucm1N-8QYGWJ85eLTktyXTS2UiS0u_3LreAsUprDGBFr1/pubchart?oid=2083135260&format=interactive"></iframe>
  </div>
</body>
