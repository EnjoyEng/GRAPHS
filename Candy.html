<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👉🎁 גרף פרסים</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* מונע גלילה מיותרת של הדף עצמו */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 100vh; /* תופס את כל גובה המסך */
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="chart-container">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT19kOZGAJsKVeMmF1oIn5sjRm18MnOKs6Ucm1N-8QYGWJ85eLTktyXTS2UiS0u_3LreAsUprDGBFr1/pubchart?oid=1844142180&format=interactive"></iframe>
</div>

</body>
</html>
