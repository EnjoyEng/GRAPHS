<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>👉🎁 Prizes Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfcfc;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative; /* מאפשר הצמדה מדויקת בתוך המכולה */
    }

    /* הגדרות המחשב המקוריות שלך - נשארות כפי שהיו */
    iframe {
      width: 180%; 
      height: 150%; 
      border: none;
      transform: scale(0.55); 
      transform-origin: center center;
      margin-right: -10%; 
    }

    /* תיקון קריטי לטלפון */
    @media only screen and (max-width: 600px) {
      .container {
        overflow-x: hidden; /* מונע גלילה מיותרת אבל שומר על התוכן */
        display: block; /* משנה מ-flex כדי למנוע מירכוז כפוי שבורח */
      }
      
      iframe {
        width: 160%; /* רוחב מספיק לעמודות מבלי "להשתגע" */
        height: 100%;
        transform: scale(0.62); /* הגדלה קלה כדי שהטקסט יהיה קריא */
        transform-origin: top right; /* הצמדה לנקודה הימנית העליונה */
        position: absolute;
        right: 0; /* מצמיד את הגרף לצד ימין של הטלפון */
        top: 0;
        margin-right: 0; /* מאפס את המרג'ין של המחשב */
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <iframe scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT19kOZGAJsKVeMmF1oIn5sjRm18MnOKs6Ucm1N-8QYGWJ85eLTktyXTS2UiS0u_3LreAsUprDGBFr1/pubchart?oid=2083135260&format=interactive"></iframe>
  </div>
</body>
</html>
