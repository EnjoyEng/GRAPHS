<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>👉🎁 Prizes Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfcfc;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* הגדרות המחשב המקוריות שלך - לא נגענו */
    iframe {
      width: 180%; 
      height: 150%; 
      border: none;
      transform: scale(0.55); 
      transform-origin: center center;
      margin-right: -10%; 
    }

    /* הפיניש הסופי לטלפון - הוספת מרחב נשימה */
    @media only screen and (max-width: 600px) {
      .container {
        display: block; 
        /* הוספת פאדינג וירטואלי סביב המכולה כדי שהגרף לא יידבק */
        padding: 10px; 
        box-sizing: border-box; /* מבטיח שהפאדינג לא יגדיל את המסך */
      }
      
      iframe {
        /* אנחנו משתמשים ב-calc כדי להוריד את ה-20px של הפאדינג מהרוחב */
        width: calc(460% - 20px); 
        height: 180%; 
        
        /* הורדנו טיפונת את ה-scale כדי לתת אוויר בצדדים */
        transform: scale(0.21); 
        -webkit-transform: scale(0.21); 
        
        transform-origin: top right;
        position: absolute;
        /* מזיזים את הגרף 10px פנימה מהקצה הימני והעליון */
        right: 10px; 
        top: 10px;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <iframe scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT19kOZGAJsKVeMmF1oIn5sjRm18MnOKs6Ucm1N-8QYGWJ85eLTktyXTS2UiS0u_3LreAsUprDGBFr1/pubchart?oid=2083135260&format=interactive"></iframe>
  </div>
</body>
</html>
