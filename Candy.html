<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>👉🎁 Prizes Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfcfc;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* הגדרות ברירת מחדל - למחשב */
    iframe {
      width: 100%;
      height: 90%;
      border: none;
      transition: all 0.3s ease; /* מעבר חלק בין מצבים */
    }

    /* השורה שחיפשת: זיהוי טלפון (מסך קטן מ-600 פיקסלים) */
    @media only screen and (max-width: 600px) {
      .container {
        align-items: flex-start; /* הצמדה למעלה בטלפון */
        overflow-x: auto; /* מאפשר גלילה הצידה אם הגרף רחב */
      }

      iframe {
        /* בטלפון אנחנו "מרחיבים" את ה-iframe וקצת מקטינים ב-scale */
        width: 200%; 
        height: 120%;
        transform: scale(0.5); 
        transform-origin: top right; /* הצמדה לימין (מתאים לעברית) */
        margin-right: -50%; /* תיקון מיקום בגלל ה-scale */
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <iframe scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT19kOZGAJsKVeMmF1oIn5sjRm18MnOKs6Ucm1N-8QYGWJ85eLTktyXTS2UiS0u_3LreAsUprDGBFr1/pubchart?oid=2083135260&format=interactive"></iframe>
  </div>
</body>
</html>
