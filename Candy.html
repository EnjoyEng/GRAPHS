<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>👉🎁 Prizes Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfcfc;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* הגדרות המחשב המקוריות שלך - ללא שינוי */
    iframe {
      width: 180%; 
      height: 150%; 
      border: none;
      transform: scale(0.55); 
      transform-origin: center center;
      margin-right: -10%; 
    }

    /* כיווץ רוחב נוסף לטלפון */
    @media only screen and (max-width: 600px) {
      .container {
        display: block; 
      }
      
      iframe {
        /* הגדלת הרוחב הווירטואלי כדי שיהיה מקום לכל העמודות */
        width: 550%; 
        height: 180%; /* הגובה נשאר דומה כי אמרת שהוא סבבה */
        
        /* כיווץ משמעותי יותר של הרוחב */
        transform: scale(0.175); 
        
        transform-origin: top right;
        position: absolute;
        right: 0; 
        top: 0;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <iframe scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT19kOZGAJsKVeMmF1oIn5sjRm18MnOKs6Ucm1N-8QYGWJ85eLTktyXTS2UiS0u_3LreAsUprDGBFr1/pubchart?oid=2083135260&format=interactive"></iframe>
  </div>
</body>
</html>
