<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>👉🎁 Prizes Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfcfc;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* החלק שביקשת לא לשנות - הגדרות המחשב המקוריות שלך */
    iframe {
      width: 180%; 
      height: 150%; 
      border: none;
      transform: scale(0.55); 
      transform-origin: center center;
      margin-right: -10%; 
    }

    /* החלק החדש - קורה רק בטלפון (מסך צר מ-600 פיקסלים) */
    @media only screen and (max-width: 600px) {
      iframe {
        width: 280%; /* הגדלה משמעותית כדי שהעמודות לא יצטופפו */
        height: 180%;
        transform: scale(0.35); /* כיווץ חזק יותר כדי שייכנס לרוחב הטלפון */
        transform-origin: top right; /* הצמדה לימין כי הגרף בעברית */
        margin-right: -90%; /* משיכה חזקה שמאלה כדי למרכז בתוך הנייד */
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <iframe scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT19kOZGAJsKVeMmF1oIn5sjRm18MnOKs6Ucm1N-8QYGWJ85eLTktyXTS2UiS0u_3LreAsUprDGBFr1/pubchart?oid=2083135260&format=interactive"></iframe>
  </div>
</body>
</html>
