<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- תגית חובה להתאמה למסכי מובייל -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👉🎁 Prizes Graph</title>
  
  <style>
    /* איפוס שוליים והגדרת גובה מלא לעמוד כדי שהגרף יתפוס את כל המסך */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* מניעת פסי גלילה כפולים */
      background-color: #f4f4f9;
    }
    
    /* הגדרת המסגרת של הגרף כך שתתפוס 100% מהמסך */
    iframe {
      width: 100%;
      height: 100%;
      border: none; /* הסרת המסגרת המכוערת מסביב */
    }
  </style>
</head>

  <!-- הטמעת הגרף ישירות בתוך העמוד במקום להפנות אליו -->
